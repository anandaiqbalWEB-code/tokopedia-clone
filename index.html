<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shopie</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            margin-top: 8px;
            margin-inline: 17px;
        }

        .container {
            border: 1px solid black;
        }

        .heading-atas-pertama {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: rgb(119, 189, 255);

            border-radius: 7px 7px 0 0;
            padding: 10px;
            padding-inline: 8%;




        }


        .searchbar input {
            background-color: #bdbdbd;
            margin: 0;
            border: none;
            font-size: 16px;
        }

        .searchbar button {
            margin: 0;
        }

        .fa-magnifying-glass {
            font-size: 20px;
        }

        .brand a {
            color: black;
            font-size: 30px;
            font-family: sans-serif;
            text-decoration: none;
        }

        button {
            background: none;
            border: none;
        }

        .searchbar {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .searchbar input {
            padding: 8px;
            width: 49%;
            outline: none;
        }






        nav {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .fa-magnifying-glass {
            background-color: blue;
            color: aliceblue;
            font-size: 11px;
            padding: 10px;
            padding-inline: 10px;
        }








        .layanan {
            display: flex;
            justify-content: center;
            gap: 24px;
        }

        .fa-truck {
            color: orange;
        }

        .fa-shield-halved {
            color: green;
        }

        .fa-headset {
            color: #fbff00;
        }

        .fa-credit-card {
            color: #6f00ff;
        }

        .macam-macam-produk img {
            width: 100%;
             height: 250px;
    object-fit: cover;
        }

        .macam-macam-produk {
            display: flex;
            justify-content: center;
            padding-inline: 30px;
            align-items: center;
            background-color: #fc0202;
            gap: 20px;
        }

        .produk {
            background-color: #05ff8a;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="heading">
                <div class="heading-atas-pertama">
                    <div class="brand">
                        <a href="#">shopie</a>
                    </div>

                    <div class="searchbar">
                        <input type="text" placeholder="cari produk">
                        <button><i class="fa-solid fa-magnifying-glass"></i></button>
                    </div>

                    <div class="userdanbelanja">
                        <button><i class="fa-solid fa-user"></i></button>
                        <button><i class="fa-solid fa-cart-shopping"></i></button>
                    </div>
                </div>

                <nav>
                    <a class="beranda" href="#">Beranda</a>
                    <a href="#">Kategori <i class="fa-solid fa-angle-down"></i></a>
                    <div>Promo</div>
                    <div>Tentang Kami</div>
                </nav>
            </div>
        </header>

        <div class="layanan">
            <div>
                <i class="fa-solid fa-truck"></i> Gratis Ongkir
            </div>
            <div>
                <i class="fa-solid fa-shield-halved "></i>Garansi
            </div>
            <div>
                <i class="fa-solid fa-headset "></i> Customer Service
            </div>
            <div>
                <i class="fa-solid fa-credit-card "></i> Pembayaran
            </div>
        </div>

        <div>
            Kategori Populer
            <div class="macam-macam-produk">
                <div class="produk">
                    <img src="gambar/kaos.webp" alt="">
                </div>

                <div class="produk">
                    <img src="gambar/pakaianwanita.webp" alt="">
                </div>

                <div class="produk">
                    <img src="gambar/komputer.webp" alt="">
                </div>

                <div class="produk">
                    <img src="gambar/handphone.webp" alt="">
                </div>

                <div class="produk">
                    <img src="gambar/makanandanminuman.webp" alt="">
                </div>

                <div class="produk">
                    <img src="gambar/kosmetik.webp" alt="">
                </div>

            </div>


        </div>
    </div>
</body>

</html>
